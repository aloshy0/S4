<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Event Registration System</title>

<style>
body {
    font-family: Arial;
    background: #0f172a;
    color: white;
    margin: 0;
}

/* NAVBAR */
nav {
    background: #1e293b;
    padding: 15px;
    text-align: center;
}

nav button {
    margin: 5px;
    padding: 10px 15px;
    background: #38bdf8;
    border: none;
    cursor: pointer;
    border-radius: 5px;
}

/* CONTAINER */
.container {
    padding: 20px;
    text-align: center;
}

/* FORM */
input, select {
    padding: 10px;
    margin: 10px;
    width: 200px;
    border-radius: 5px;
    border: none;
}

button.submit {
    background: #22c55e;
    color: white;
}

/* CARDS */
.cards {
    display: flex;
    justify-content: center;
    gap: 20px;
    margin: 20px;
}

.card {
    background: #1e293b;
    padding: 20px;
    border-radius: 10px;
    width: 150px;
}

/* TABLE */
table {
    width: 80%;
    margin: auto;
    border-collapse: collapse;
}

th, td {
    padding: 10px;
    border: 1px solid #334155;
}

.delete-btn {
    background: red;
    color: white;
    border: none;
    padding: 5px;
    cursor: pointer;
}
</style>
</head>

<body>

<nav>
    <button onclick="showSection('home')">Home</button>
    <button onclick="showSection('register')">Register</button>
    <button onclick="showSection('participants')">Participants</button>
</nav>

<!-- HOME -->
<div id="home" class="container">
    <h1>Event Registration System</h1>

    <div class="cards">
        <div class="card">
            <h3>Total Users</h3>
            <p id="totalUsers">0</p>
        </div>
        <div class="card">
            <h3>Total Events</h3>
            <p>3</p>
        </div>
    </div>
</div>

<!-- REGISTER -->
<div id="register" class="container" style="display:none;">
    <h2>Register</h2>

    <input type="text" id="name" placeholder="Name"><br>
    <input type="email" id="email" placeholder="Email"><br>

    <select id="event">
        <option value="">Select Event</option>
        <option>Workshop</option>
        <option>Seminar</option>
        <option>Hackathon</option>
    </select><br>

    <button class="submit" onclick="register()">Submit</button>

    <p id="msg"></p>
</div>

<!-- PARTICIPANTS -->
<div id="participants" class="container" style="display:none;">
    <h2>Participants</h2>

    <table id="table">
        <tr>
            <th>Name</th>
            <th>Email</th>
            <th>Event</th>
            <th>Action</th>
        </tr>
    </table>
</div>

<script>

// NAVIGATION
function showSection(section) {
    document.getElementById("home").style.display = "none";
    document.getElementById("register").style.display = "none";
    document.getElementById("participants").style.display = "none";

    document.getElementById(section).style.display = "block";

    if(section === "participants") loadData();
    if(section === "home") updateStats();
}

// SAVE DATA
function saveData(name, email, event) {
    let users = JSON.parse(localStorage.getItem("users")) || [];
    users.push({ name, email, event });
    localStorage.setItem("users", JSON.stringify(users));
}

// REGISTER
function register() {
    let name = document.getElementById("name").value.trim();
    let email = document.getElementById("email").value.trim();
    let event = document.getElementById("event").value;
    let msg = document.getElementById("msg");

    if (!name || !email || !event) {
        msg.innerText = "Fill all fields!";
        msg.style.color = "red";
        return;
    }

    if (!email.includes("@") || !email.includes(".")) {
        msg.innerText = "Invalid email!";
        msg.style.color = "red";
        return;
    }

    saveData(name, email, event);

    msg.innerText = "Registration Successful!";
    msg.style.color = "lightgreen";

    document.getElementById("name").value = "";
    document.getElementById("email").value = "";
    document.getElementById("event").value = "";

    updateStats();
}

// LOAD TABLE
function loadData() {
    let users = JSON.parse(localStorage.getItem("users")) || [];
    let table = document.getElementById("table");

    table.innerHTML = `
        <tr>
            <th>Name</th>
            <th>Email</th>
            <th>Event</th>
            <th>Action</th>
        </tr>
    `;

    users.forEach((user, index) => {
        table.innerHTML += `
            <tr>
                <td>${user.name}</td>
                <td>${user.email}</td>
                <td>${user.event}</td>
                <td><button class="delete-btn" onclick="deleteUser(${index})">Delete</button></td>
            </tr>
        `;
    });
}

// DELETE USER
function deleteUser(index) {
    let users = JSON.parse(localStorage.getItem("users")) || [];
    users.splice(index, 1);
    localStorage.setItem("users", JSON.stringify(users));
    loadData();
    updateStats();
}

// UPDATE STATS
function updateStats() {
    let users = JSON.parse(localStorage.getItem("users")) || [];
    document.getElementById("totalUsers").innerText = users.length;
}

// INIT
updateStats();

</script>

</body>
</html>
